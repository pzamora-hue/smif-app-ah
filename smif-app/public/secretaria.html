<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="estilos.css">
  <title>Secretaría | SMIF</title>
 
  <style>
    :root {
      --fondo: #ffffff;
      --panel: #ffffff;
      --linea: #2a52b8;
      --texto: #2a52b8;
      --suave: #93a4b8;
      --cian: #52cfe0;
      --azul: #004aad;
      --error: #ff8a8a;
      --ok: #7ee2a8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--fondo);
      color: var(--texto);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      line-height: 1.5;
    }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px clamp(16px, 4vw, 48px);
      border-bottom: 1px solid var(--linea);
    }
    .marca { font-size: 1.25rem; font-weight: 700; letter-spacing: .02em; }
    .marca span { color: var(--cian); }
    main { max-width: 1100px; margin: 0 auto; padding: 32px clamp(16px, 4vw, 48px) 64px; }
    h1 { margin: 0 0 4px; font-size: 1.75rem; }
    .sub { margin: 0 0 28px; color: var(--suave); }
    .tarjeta {
      background: var(--panel);
      border: 1px solid var(--linea);
      border-radius: 14px;
      padding: 24px;
      margin-bottom: 28px;
    }
    .tabs { display: inline-flex; border: 1px solid var(--linea); border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
    .tabs button {
      background: transparent; color: var(--suave); border: 0;
      padding: 10px 22px; font: inherit; font-weight: 600; cursor: pointer;
    }
    .tabs button[aria-selected="true"] { background: var(--cian); color: #04222a; }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .campo { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: .9rem; color: var(--suave); }
    input, select {
      background: #ffffff; color: var(--texto);
      border: 1px solid var(--linea); border-radius: 8px;
      padding: 10px 12px; font: inherit;
    }
    input:focus-visible, select:focus-visible, button:focus-visible {
      outline: 2px solid var(--cian); outline-offset: 2px;
    }
    .solo-alumno, .solo-docente { display: none; }
    form[data-rol="alumno"] .solo-alumno { display: flex; }
    form[data-rol="docente"] .solo-docente { display: flex; }
    .acciones { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
    .btn {
      background: linear-gradient(180deg, var(--cian), var(--azul));
      color: #fff; border: 0; border-radius: 8px;
      padding: 11px 22px; font: inherit; font-weight: 700; cursor: pointer;
    }
    .btn:disabled { opacity: .6; cursor: wait; }
    .btn-sec { background: transparent; border: 1px solid var(--linea); color: var(--texto); font-weight: 600; }
    #mensaje { min-height: 1.4em; margin: 0; font-weight: 600; }
    #mensaje.ok { color: var(--ok); }
    #mensaje.error { color: var(--error); }
    .cabecera-lista { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 14px; }
    .cabecera-lista h2 { margin: 0; font-size: 1.2rem; }
    #buscar { min-width: 240px; }
    .tabla-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 640px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--linea); }
    th { color: var(--suave); font-weight: 600; font-size: .9rem; }
    .vacio { color: var(--suave); padding: 20px 12px; }
    @media (prefers-reduced-motion: no-preference) {
      .tarjeta { animation: entrar .25s ease-out; }
      @keyframes entrar { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    }
  </style>
</head>
<body>
  <header>
    <div class="marca">SM<span>IF</span> · Secretaría</div>
    <button class="btn btn-sec" id="salir" type="button">Cerrar sesión</button>
  </header>

  <main>
    <h1>Crear usuarios</h1>
    <p class="sub">Registra a los alumnos y docentes de la academia. Ellos inician sesión con su DNI y la contraseña que les asignes.</p>

    <section class="tarjeta" aria-labelledby="titulo-form">
      <div class="tabs" role="tablist" aria-label="Tipo de usuario">
        <button type="button" role="tab" id="tab-alumno" aria-selected="true" data-rol="alumno">Alumno</button>
        <button type="button" role="tab" id="tab-docente" aria-selected="false" data-rol="docente">Docente</button>
      </div>

      <form id="form" data-rol="alumno" novalidate>
        <div class="campo">
          <label for="dni">DNI</label>
          <input id="dni" name="dni" inputmode="numeric" maxlength="8" pattern="\d{8}" autocomplete="off" required>
        </div>
        <div class="campo">
          <label for="nombre">Nombres</label>
          <input id="nombre" name="nombre" maxlength="80" required>
        </div>
        <div class="campo">
          <label for="apellidos">Apellidos</label>
          <input id="apellidos" name="apellidos" maxlength="80" required>
        </div>
        <div class="campo">
          <label for="email">Correo</label>
          <input id="email" name="email" type="email" maxlength="100" required>
        </div>
        <div class="campo">
          <label for="celular">Celular</label>
          <input id="celular" name="celular" inputmode="numeric" maxlength="9" pattern="\d{9}" required>
        </div>
        <div class="campo">
          <label for="password">Contraseña inicial</label>
          <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
        </div>

        <div class="campo solo-alumno">
          <label for="ciclo">Ciclo</label>
          <input id="ciclo" name="ciclo" maxlength="30" placeholder="Ciclo 1">
        </div>
        <div class="campo solo-alumno">
          <label for="modalidad">Modalidad</label>
          <select id="modalidad" name="modalidad">
            <option value="">Sin definir</option>
            <option value="presencial">Presencial</option>
            <option value="virtual">Virtual</option>
            <option value="híbrida">Híbrida</option>
          </select>
        </div>
        <div class="campo solo-docente">
          <label for="especialidad">Especialidad</label>
          <input id="especialidad" name="especialidad" maxlength="80" placeholder="Matemática">
        </div>

        <div class="acciones">
          <button class="btn" id="guardar" type="submit">Crear alumno</button>
          <p id="mensaje" role="status" aria-live="polite"></p>
        </div>
      </form>
    </section>

    <section class="tarjeta" aria-labelledby="titulo-lista">
      <div class="cabecera-lista">
        <h2 id="titulo-lista">Alumnos registrados</h2>
        <input id="buscar" type="search" placeholder="Buscar por nombre o DNI" aria-label="Buscar">
      </div>
      <div class="tabla-wrap">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    
    const API = '/api/secretaria';
    const LOGOUT_URL = '/api/auth/logout';
    const LOGIN_PAGE = '/login.html';

    const form = document.getElementById('form');
    const mensaje = document.getElementById('mensaje');
    const guardar = document.getElementById('guardar');
    const tbody = document.getElementById('tbody');
    const thead = document.getElementById('thead');
    const buscar = document.getElementById('buscar');
    const titulo = document.getElementById('titulo-lista');
    let rol = 'alumno';
    let filas = [];

    const COLUMNAS = {
      alumno: [['dni', 'DNI'], ['nombre', 'Nombres'], ['apellidos', 'Apellidos'], ['email', 'Correo'], ['celular', 'Celular'], ['ciclo', 'Ciclo'], ['modalidad', 'Modalidad']],
      docente: [['dni', 'DNI'], ['nombre', 'Nombres'], ['apellidos', 'Apellidos'], ['email', 'Correo'], ['celular', 'Celular'], ['especialidad', 'Especialidad']]
    };

    function avisar(texto, tipo) {
      mensaje.textContent = texto || '';
      mensaje.className = tipo || '';
    }

    async function pedir(url, opciones) {
      const res = await fetch(url, { credentials: 'same-origin', ...opciones });
      if (res.status === 401) { location.href = LOGIN_PAGE; throw new Error('Sesión vencida'); }
      let json = {};
      try { json = await res.json(); } catch (_) { /* respuesta sin cuerpo */ }
      if (!res.ok) throw new Error(json.message || 'No se pudo completar la acción');
      return json;
    }

    function pintarTabla() {
      const q = buscar.value.trim().toLowerCase();
      const cols = COLUMNAS[rol];
      thead.replaceChildren();
      const trh = document.createElement('tr');
      cols.forEach(([, nombre]) => { const th = document.createElement('th'); th.textContent = nombre; trh.append(th); });
      thead.append(trh);

      tbody.replaceChildren();
      const visibles = filas.filter((f) => !q || `${f.nombre} ${f.apellidos} ${f.dni}`.toLowerCase().includes(q));
      if (!visibles.length) {
        const tr = document.createElement('tr');
        const td = document.createElement('td');
        td.colSpan = cols.length;
        td.className = 'vacio';
        td.textContent = filas.length ? 'No hay resultados para esa búsqueda.' : 'Aún no hay registros. Crea el primero con el formulario.';
        tr.append(td); tbody.append(tr);
        return;
      }
      visibles.forEach((f) => {
        const tr = document.createElement('tr');
        cols.forEach(([clave]) => { const td = document.createElement('td'); td.textContent = f[clave] || '—'; tr.append(td); });
        tbody.append(tr);
      });
    }

    async function cargar() {
      try {
        const json = await pedir(`${API}/${rol}s`);
        filas = json.data || [];
      } catch (e) {
        filas = [];
        avisar(e.message, 'error');
      }
      pintarTabla();
    }

    function cambiarRol(nuevo) {
      rol = nuevo;
      form.dataset.rol = nuevo;
      document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.rol === nuevo)));
      guardar.textContent = nuevo === 'alumno' ? 'Crear alumno' : 'Crear docente';
      titulo.textContent = nuevo === 'alumno' ? 'Alumnos registrados' : 'Docentes registrados';
      buscar.value = '';
      avisar('');
      cargar();
    }

    document.querySelectorAll('.tabs button').forEach((b) => b.addEventListener('click', () => cambiarRol(b.dataset.rol)));
    buscar.addEventListener('input', pintarTabla);

    form.addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const d = Object.fromEntries(new FormData(form).entries());
      if (!/^\d{8}$/.test(d.dni || '')) return avisar('El DNI debe tener 8 dígitos.', 'error');
      if (!/^\d{9}$/.test(d.celular || '')) return avisar('El celular debe tener 9 dígitos.', 'error');
      if ((d.password || '').length < 8) return avisar('La contraseña debe tener al menos 8 caracteres.', 'error');
      if (!d.nombre.trim() || !d.apellidos.trim() || !d.email.trim()) return avisar('Completa nombres, apellidos y correo.', 'error');

      guardar.disabled = true;
      avisar('Guardando…');
      try {
        await pedir(`${API}/${rol}s`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(d)
        });
        form.reset();
        avisar(rol === 'alumno' ? 'Alumno creado.' : 'Docente creado.', 'ok');
        await cargar();
      } catch (e) {
        avisar(e.message, 'error');
      } finally {
        guardar.disabled = false;
      }
    });

    document.getElementById('salir').addEventListener('click', async () => {
      try { await fetch(LOGOUT_URL, { method: 'POST', credentials: 'same-origin' }); } catch (_) { /* se redirige igual */ }
      location.href = LOGIN_PAGE;
    });

    cargar();
  </script>
</body>
</html>
